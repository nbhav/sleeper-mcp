services:
  sleeper:
    build: .
    volumes:
      - ./data:/data
    environment:
      SLEEPER_CACHE_DIR: /data
      SLEEPER_CACHE_DB: /data/sleeper.db
  sleeper-mcp:
    build: .
    entrypoint: ["/app/.venv/bin/sleeper-mcp"]
    stdin_open: true
    volumes:
      - ./data:/data
    environment:
      SLEEPER_CACHE_DIR: /data
      SLEEPER_CACHE_DB: /data/sleeper.db
      SLEEPER_DEFAULT_LEAGUE_ID:
      SLEEPER_DEFAULT_ROSTER_ID:
  cloudflare-worker:
    image: node:22-bookworm-slim
    working_dir: /worker
    entrypoint: ["npm"]
    volumes:
      - ./cloudflare-worker:/worker
    environment:
      CLOUDFLARE_ACCOUNT_ID:
      CLOUDFLARE_API_TOKEN:
