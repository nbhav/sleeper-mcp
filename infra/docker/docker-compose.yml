name: sleeper-mcp

services:
  sleeper:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    volumes:
      - ../../data:/data
    env_file:
      - path: ../../data/sleeper-mcp.env
        required: false
    environment:
      - SLEEPER_CACHE_DIR=/data
      - SLEEPER_CACHE_DB=/data/sleeper.db
  sleeper-mcp:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    entrypoint: ["/app/.venv/bin/sleeper-mcp"]
    stdin_open: true
    volumes:
      - ../../data:/data
    env_file:
      - path: ../../data/sleeper-mcp.env
        required: false
    environment:
      - SLEEPER_CACHE_DIR=/data
      - SLEEPER_CACHE_DB=/data/sleeper.db
  cloudflare-worker:
    build:
      context: ../cloudflare-worker
      dockerfile: Dockerfile
    working_dir: /worker
    entrypoint: ["npm"]
    volumes:
      - ../cloudflare-worker:/worker
      - worker_node_modules:/worker/node_modules
    environment:
      CLOUDFLARE_ACCOUNT_ID:
      CLOUDFLARE_API_TOKEN:

volumes:
  worker_node_modules:
