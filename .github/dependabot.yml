version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/infra/cloudflare-worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directories:
      - "/infra/docker"
      - "/infra/cloudflare-worker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
