name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image
        run: make build

      - name: Run unit tests
        run: make test

      - name: Clean up Docker resources
        if: always()
        run: make ci-teardown

  sleeper-integration:
    name: Sleeper API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image
        run: make build

      - name: Run Sleeper API integration tests
        run: make integration-test

      - name: Clean up Docker resources
        if: always()
        run: make ci-teardown

  worker-typecheck:
    name: Cloudflare Worker typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cloudflare Worker dependencies
        run: make worker-install

      - name: Typecheck Cloudflare Worker
        run: make worker-typecheck

      - name: Run Cloudflare Worker tests
        run: make worker-test

      - name: Clean up Docker resources
        if: always()
        run: make ci-teardown
