name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: make build

      - name: Run unit tests
        run: make test

      - name: Clean up Docker resources
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v --remove-orphans

  sleeper-integration:
    name: Sleeper API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: make build

      - name: Run Sleeper API integration tests
        run: make integration-test

      - name: Clean up Docker resources
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v --remove-orphans

  worker-typecheck:
    name: Cloudflare Worker typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Cloudflare Worker dependencies
        run: make worker-install

      - name: Typecheck Cloudflare Worker
        run: make worker-typecheck

      - name: Clean up Docker resources
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v --remove-orphans
