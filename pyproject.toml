[project]
name = "sleeper-tooling"
version = "0.1.0"
description = "Dockerized Python tooling for pulling fantasy football data from the Sleeper API."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
sleeper = "sleeper_tooling.cli:app"
sleeper-mcp = "sleeper_tooling.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleeper_tooling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
